<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics & Fluid Mechanics Interactive Assessment</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --correct-bg: #f0fdf4;
      --correct-border: #86efac;
      --correct-text: #166534;
      --incorrect-bg: #fef2f2;
      --incorrect-border: #fecaca;
      --incorrect-text: #991b1b;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 5rem;
    }

    /* Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 2.5rem 1.5rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 650px;
      margin: 0 auto;
    }

    .shuffle-badge {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.3rem 0.85rem;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
    }

    /* Quiz Container */
    .quiz-container {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* Score Banner */
    .score-banner {
      display: none;
      background: var(--card-bg);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 2rem;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.1);
      animation: fadeIn 0.2s ease-out;
    }

    .score-banner.show { display: block; }

    .score-banner h2 {
      font-size: 1.6rem;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .score-banner p {
      font-size: 1rem;
      color: var(--text-muted);
    }

    /* Question Cards */
    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      animation: fadeIn 0.15s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .q-num {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .q-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.45;
    }

    /* Options */
    .options-group {
      display: grid;
      gap: 0.65rem;
    }

    .option-label {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      padding: 0.85rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      background: #ffffff;
      transition: all 0.15s ease;
      font-size: 0.98rem;
    }

    .option-label:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .option-label input[type="radio"] {
      margin-top: 0.25rem;
      cursor: pointer;
      accent-color: var(--primary);
      transform: scale(1.15);
    }

    .option-letter {
      font-weight: 700;
      color: var(--text-muted);
      min-width: 1.2rem;
    }

    /* Feedback highlights after submission */
    .option-label.is-correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
      font-weight: 600;
    }

    .option-label.is-wrong {
      background: var(--incorrect-bg) !important;
      border-color: var(--incorrect-border) !important;
      color: var(--incorrect-text) !important;
    }

    /* Explanation Section */
    .explanation-box {
      display: none;
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px dashed var(--border);
    }

    .explanation-box.show { display: block; }

    .explanation-box h4 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .breakdown-row {
      font-size: 0.9rem;
      padding: 0.6rem 0.85rem;
      border-radius: 6px;
      margin-bottom: 0.45rem;
      line-height: 1.45;
    }

    .breakdown-row.correct {
      background: var(--correct-bg);
      border-left: 4px solid #22c55e;
      color: var(--correct-text);
    }

    .breakdown-row.incorrect {
      background: var(--incorrect-bg);
      border-left: 4px solid #ef4444;
      color: var(--incorrect-text);
    }

    /* Buttons */
    .quiz-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2.5rem 0 1rem 0;
    }

    .btn {
      padding: 0.85rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      transition: background 0.15s ease;
    }

    .btn-submit {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-submit:hover { background: var(--primary-hover); }

    .btn-reset {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-reset:hover { background: #cbd5e1; }
  </style>
</head>

          { letter: "B", text: "It allows heat to pass quickly through the hydraulic fluid.", isCorrect: false, exp: "Thermal conductivity is irrelevant to mechanical lifting capacity." },
          { letter: "C", text: "It allows a small input force to be transmitted as pressure throughout the fluid.", isCorrect: true, exp: "Pascal's principle ensures pressure applied at a narrow input cylinder transmits undiminished to a wide cylinder, creating the multiplied lifting force necessary to raise a vehicle." },
          { letter: "D", text: "It allows fast-moving fluid to create areas of lower pressure.", isCorrect: false, exp: "This describes Bernoulli's principle for dynamic fluids, not static hydraulic pressure." }
        ]
      }
    ];

    // Fisher-Yates shuffle algorithm
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    // Render questions dynamically in current shuffled order
    function renderQuiz() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      questionsData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${item.id}`;

        let optionsHtml = '';
        item.options.forEach(opt => {
          optionsHtml += `
            <label class="option-label" data-choice="${opt.letter}">
              <input type="radio" name="${item.id}" value="${opt.letter}">
              <span class="option-letter">${opt.letter}.</span>
              <span>${opt.text}</span>
            </label>
          `;
        });

        let breakdownHtml = '';
        item.options.forEach(opt => {
          breakdownHtml += `
            <div class="breakdown-row ${opt.isCorrect ? 'correct' : 'incorrect'}">
              <strong>${opt.letter}${opt.isCorrect ? ' (Correct)' : ''}:</strong> ${opt.exp}
            </div>
          `;
        });

        card.innerHTML = `
          <div class="question-header">
            <span class="q-num">Question ${index + 1}</span>
            <span class="q-text">${item.question}</span>
          </div>
          <div class="options-group">
            ${optionsHtml}
          </div>
          <div class="explanation-box" id="exp-${item.id}">
            <h4>Detailed Explanation</h4>
            ${breakdownHtml}
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Grade assessment
    function gradeQuiz() {
      const form = document.getElementById('quizForm');
      let score = 0;
      const total = questionsData.length;

      questionsData.forEach(item => {
        const selected = form.elements[item.id]?.value;
        const card = document.getElementById(`card-${item.id}`);
        const labels = card.querySelectorAll('.option-label');
        const expBox = document.getElementById(`exp-${item.id}`);

        labels.forEach(l => {
          l.classList.remove('is-correct', 'is-wrong');
          const choice = l.getAttribute('data-choice');
          if (choice === item.correct) {
            l.classList.add('is-correct');
          } else if (choice === selected && selected !== item.correct) {
            l.classList.add('is-wrong');
          }
        });

        if (selected === item.correct) score++;
        expBox.classList.add('show');
      });

      const banner = document.getElementById('scoreBanner');
      const scoreTitle = document.getElementById('scoreTitle');
      const scoreSubtitle = document.getElementById('scoreSubtitle');
      const percentage = Math.round((score / total) * 100);

      scoreTitle.textContent = `Score: ${score} / ${total} (${percentage}%)`;
      if (percentage >= 80) {
        scoreSubtitle.textContent = "Excellent work! You have demonstrated strong conceptual understanding.";
      } else if (percentage >= 60) {
        scoreSubtitle.textContent = "Good effort! Review the green and red breakdown notes below to solidify your grasp.";
      } else {
        scoreSubtitle.textContent = "Take time to study the explanations below before trying again.";
      }
      banner.classList.add('show');
      banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Reset, clear answers, and re-shuffle questions
    function resetAndShuffleQuiz() {
      const form = document.getElementById('quizForm');
      form.reset();

      // Shuffle array in place
      shuffleArray(questionsData);

      // Re-render questions in their new shuffled positions
      renderQuiz();

      // Hide score banner and scroll smoothly to top
      const banner = document.getElementById('scoreBanner');
      banner.classList.remove('show');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initial shuffle and load
    shuffleArray(questionsData);
    renderQuiz();
  </script>
</body>
</html>
